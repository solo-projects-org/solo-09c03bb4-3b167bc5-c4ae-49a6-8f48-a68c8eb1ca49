services:
  pm25-planner:
    build: .
    image: pm25-planner:1.1.0
    container_name: pm25-planner
    ports:
      - "8000:8000"
    environment:
      PM25_ARCHIVE_DIR: /data/archive
      # 清单模式：档案清单由外部系统维护并原子替换
      PM25_MANIFEST_PATH: /data/manifest/manifest.json
      # 统计验真开关：开启后未通过验真的文件不做统计裁剪（仅清单模式生效）
      PM25_VERIFY_ENABLED: "1"
      # 验真结论库（默认 <清单目录>/verification.json，随数据卷持久化，重启沿用）
      # PM25_VERIFY_STORE_PATH: /data/manifest/verification.json
      # PM25_VERIFY_WORKERS: "2"
      PM25_COLUMN: pm25
      PM25_PREVIEW_MAX_FILES: "50"
      # 设为 1 时容器启动自动生成样例数据（仅当档案目录为空）
      GENERATE_SAMPLE: "1"
    volumes:
      - pm25-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pm25-data:
